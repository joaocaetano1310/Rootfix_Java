spring:
  application:
    name: rootfix-api-java
  config:
    import: "optional:file:.env[.properties]"
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
    listener:
      simple:
        default-requeue-rejected: false

  ai:
    model:
      chat: ${IA_PROVEDOR:none}
    chat:
      client:
        enabled: false
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${IA_MODELO:gemini-3.5-flash}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

rootfix:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:rootfix-api}
    expiracao-minutos: ${JWT_EXPIRATION_MINUTES:480}
  foto:
    tamanho-maximo-bytes: 5242880
  dados-iniciais: ${DADOS_INICIAIS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
  health:
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}
